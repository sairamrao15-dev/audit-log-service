spring:
  application:
    name: audit-log-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditlog}
    username: ${DB_USERNAME:auditlog}
    password: ${DB_PASSWORD:auditlog}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
audit:
  retention:
    # Archiving is explicit through the retention endpoint; this is its default cutoff.
    archive-after: ${AUDIT_ARCHIVE_AFTER:365d}

server:
  error:
    include-message: never

audit-log:
  kafka:
    enabled: false
